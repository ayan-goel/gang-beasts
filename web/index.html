<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#351d37">
    <meta name="description" content="A rooftop rumble for floppy little fighters. Host a private room or share a keyboard.">
    <link rel="icon" href="/bean.png">
    <link rel="stylesheet" href="/src/menu/menu.css">
    <script type="module" src="/src/menu/textSize.ts"></script>
    <title>gang bbeasts</title>
  </head>
  <body>
    <main class="menu">
      <div class="poster">
        <img src="/src/menu/skyline-scramble.webp" alt="A red bean swings a blue rival over the edge of a rooftop TV station." width="1350" height="900" fetchpriority="high">
        <div class="stage-ticket"><span aria-hidden="true">✷</span> Skyline <small>Rooftop melee</small></div>
      </div>
      <section class="choices" aria-labelledby="title">
        <div class="intro">
          <h1 id="title" aria-label="gang bbeasts"><span>gang</span> <span>bbeasts</span></h1>
          <p>Grab a friend. Toss ’em off the roof.<br> First to three ring-outs wins.</p>
        </div>
        <nav aria-label="Play gang bbeasts">
          <h2>Private multiplayer <small>2–8 players</small></h2>
          <div class="rooms">
            <a class="host" href="/rooms/">Host a room <span aria-hidden="true">↗</span></a>
            <a class="join" href="/rooms/?action=join">Join a room <span aria-hidden="true">↗</span></a>
          </div>
          <a class="local" href="/play/"><strong>Local match</strong><small>Two players, one keyboard</small><span aria-hidden="true">→</span></a>
        </nav>
        <footer><a href="/playground/">Physics playground</a>
          <label id="menu-text-size" hidden>Text size <select></select></label>
        </footer>
      </section>
    </main>
  </body>
