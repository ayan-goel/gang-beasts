[workspace]
members = ["crates/engine"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
rapier3d = { version = "=0.26.1", features = ["enhanced-determinism"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
