[package]
name = "brawler-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
browser-fixtures = []

[dependencies]
brawler-engine = { path = "../engine" }
brawler-protocol = { path = "../protocol" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
serde.workspace = true
getrandom = "=0.2.17"
sha2 = "=0.10.9"

serde_json.workspace = true

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
